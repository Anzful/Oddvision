<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Oddvision</title>
  <style>
    :root {
      --bg: #0f0f19;
      --panel: rgba(15, 15, 25, 0.72);
      --border: rgba(255, 255, 255, 0.08);
      --text: #eaeaf0;
      --text-dim: #a7a8b3;
      --accent: #7c3aed;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      padding: 14px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: var(--text);
      background: radial-gradient(500px 300px at 85% -10%, rgba(124,58,237,.16), transparent 60%),
                  radial-gradient(420px 260px at 5% 0%, rgba(34,211,238,.12), transparent 60%),
                  var(--bg);
    }
    .container {
      border: 1px solid var(--border);
      background: var(--panel);
      border-radius: 14px;
      padding: 16px;
      backdrop-filter: blur(10px);
    }
    .header { text-align: center; margin-bottom: 14px; }
    .header h1 { font-size: 20px; letter-spacing: -.01em; margin-bottom: 4px; }
    .header p { font-size: 12px; color: var(--text-dim); }

    .toggle-section {
      margin-bottom: 14px;
      padding: 12px;
      background: rgba(255,255,255,.04);
      border-radius: 10px;
      border: 1px solid var(--border);
      text-align: center;
    }
    .toggle-label {
      display: block; margin-bottom: 10px; font-weight: 800; color: var(--text); font-size: 13px;
    }
    .switch { position: relative; display: inline-block; width: 56px; height: 30px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; inset: 0; border-radius: 30px;
      background: rgba(255,255,255,.08); border: 1px solid var(--border);
      transition: 0.25s;
    }
    .slider:before {
      position: absolute; content: ""; height: 22px; width: 22px; left: 4px; top: 3px;
      background: #fff; border-radius: 50%; transition: 0.25s;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    input:checked + .slider {
      background: linear-gradient(135deg, var(--accent), #5b21b6);
      border-color: transparent;
      box-shadow: 0 6px 20px rgba(124,58,237,.35);
    }
    input:checked + .slider:before { transform: translateX(26px); }
    .status { margin-top: 8px; font-size: 12px; color: var(--text-dim); font-style: italic; }
    .status.enabled { color: #22d3ee; }

    .instructions {
      background: rgba(255,255,255,.04);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 12px;
    }
    .instructions h3 { font-size: 13px; margin-bottom: 6px; color: var(--text); }
    .instructions p { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
    .shortcut {
      display: inline-block; background: rgba(255,255,255,.06); padding: 3px 6px; border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px; font-weight: 800; color: var(--text); border: 1px solid var(--border);
    }

    .settings-btn {
      width: 100%; padding: 12px; border: none; border-radius: 10px; cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #5b21b6); color: white; font-weight: 800;
      box-shadow: 0 10px 24px rgba(124,58,237,.35);
    }
    .settings-btn:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🔮 Oddvision</h1>
      <p style="opacity:.75">Stealth overlay controls</p>
    </div>

    <div class="toggle-section">
      <label class="toggle-label">Extension Status</label>
      <label class="switch">
        <input type="checkbox" id="enable-toggle">
        <span class="slider"></span>
      </label>
      <div class="status" id="status-text">Disabled</div>
    </div>

    <div class="instructions">
      <h3>📖 How to Use</h3>
      <p><strong>1.</strong> <span class="shortcut">Alt+1</span> - Capture page</p>
      <p><strong>2.</strong> <span class="shortcut">Alt+2</span> - Analyze</p>
      <p><strong>3.</strong> <span class="shortcut">Alt+3</span> - View overlay</p>
      <p><strong>4.</strong> <span class="shortcut">Alt+4</span> - Text color</p>
      <p style="margin-top: 12px; font-size: 11px; color: #999;">💡 Automatic failover: Groq → OpenRouter</p>
    </div>

    <button class="settings-btn" id="settings-btn">⚙️ Extension Settings</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
